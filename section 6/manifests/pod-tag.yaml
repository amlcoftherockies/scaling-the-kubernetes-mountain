apiVersion: v1
kind: Pod
metadata:
  name: ckad-app-tag
spec:
  containers:
  - name: ckad-app
    # Replace with YOUR image by tag, e.g. ttl.sh/ckad-app-jsmith:1h
    # (Private registry? add `imagePullSecrets: [{name: regcred}]` under spec; see Module 2.3.)
    image: ttl.sh/ckad-app-YOURNAME:1h
    ports:
    - containerPort: 8080
