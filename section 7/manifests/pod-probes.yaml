apiVersion: v1
kind: Pod
metadata:
  name: probes-demo
  labels:
    app: probes-demo
spec:
  containers:
  - name: web
    image: docker.io/library/nginx:1.25-alpine
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - |
      echo "Simulating slow legacy initialization (6 seconds)..."
      sleep 6
      echo "Initialization complete! Creating /tmp/ready and starting Nginx..."
      touch /tmp/ready
      exec nginx -g "daemon off;"
    # 1. Startup Probe: disables liveness/readiness until the app finishes booting.
    #    Allows up to 15 * 2s = 30s for startup.
    startupProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 2
      failureThreshold: 15
    # 2. Readiness Probe: controls whether this Pod receives Service traffic.
    #    If /tmp/ready is missing, the Pod stays Running (no restart!) but is removed from Service endpoints.
    readinessProbe:
      exec:
        command: ["cat", "/tmp/ready"]
      periodSeconds: 3
      failureThreshold: 1
    # 3. Liveness Probe: restarts the container if the nginx process hangs or stops serving port 80.
    livenessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
      failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: probes-svc
spec:
  selector:
    app: probes-demo
  ports:
  - port: 80
    targetPort: 80
