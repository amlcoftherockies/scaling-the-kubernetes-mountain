apiVersion: v1
kind: Pod
metadata:
  name: log-tracker
  labels:
    app: log-tracker
spec:
  containers:
  # Main application logging to stdout
  - name: payment-api
    image: docker.io/library/busybox:1.36
    command:
    - sh
    - -c
    - |
      i=1
      while true; do
        echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") [INFO] payment-api processed order #${i}"
        i=$((i+1))
        sleep 3
      done
  # Sidecar container that crashes and restarts every ~8 seconds so you can test --previous (-p)
  - name: flaky-worker
    image: docker.io/library/busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "[BOOT] flaky-worker starting up..."
      sleep 5
      echo "[FATAL] flaky-worker encountered unhandled panic: database connection timeout!" >&2
      exit 1
