# Two backend microservices (v1 and v2) for Ingress & Gateway API HTTP routing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-demo
      version: v1
  template:
    metadata:
      labels:
        app: route-demo
        version: v1
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=Served by Backend v1 (Stable)"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: v1-svc
spec:
  selector:
    app: route-demo
    version: v1
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-demo
      version: v2
  template:
    metadata:
      labels:
        app: route-demo
        version: v2
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=Served by Backend v2 (New Release)"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: v2-svc
spec:
  selector:
    app: route-demo
    version: v2
  ports:
  - port: 80
    targetPort: 5678
