# Custom Helm values for deploying the CNCF `podinfo` microservice into your namespace
replicaCount: 2

ui:
  color: "#1e3a8a"
  message: "Deployed via Helm in the CKAD Workshop!"

# Disable ServiceAccount creation so the chart runs with your default SA
serviceAccount:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
