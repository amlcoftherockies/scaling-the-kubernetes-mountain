apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-agent
  labels:
    app: node-log-agent
spec:
  selector:
    matchLabels:
      app: node-log-agent
  template:
    metadata:
      labels:
        app: node-log-agent
    spec:
      containers:
      - name: agent
        image: docker.io/library/busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Node utility agent started on node: $(hostname)"
          while true; do
            echo "[$(date)] Node heartbeat OK"
            sleep 30
          done
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
