apiVersion: v1
kind: Pod
metadata:
  name: nginx-multi
  labels:
    app: multi-app
spec:
  volumes:
  - name: shared-html
    emptyDir: {}

  containers:
  # Container 1: The web server serving content from the shared volume
  - name: web-server
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-html
      mountPath: /usr/share/nginx/html

  # Container 2: A sidecar generator that periodically writes to the shared volume
  - name: content-generator
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      while true; do
        echo "Hello from the Sidecar Container! Time: $(date)" > /var/html/index.html
        sleep 5
      done
    volumeMounts:
    - name: shared-html
      mountPath: /var/html
