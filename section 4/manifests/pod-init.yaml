apiVersion: v1
kind: Pod
metadata:
  name: pod-init-demo
  labels:
    app: init-demo
spec:
  # Init containers run sequentially to completion BEFORE any app container starts.
  initContainers:
  - name: seed-html
    image: docker.io/library/busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "Seeding configuration and initial HTML..."
      sleep 2
      echo "<h1>Initialized by Init Container at $(date)</h1>" > /work-dir/index.html
    volumeMounts:
    - name: shared-html
      mountPath: /work-dir
  containers:
  - name: web-server
    image: docker.io/library/nginx:1.25-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: shared-html
    emptyDir: {}
