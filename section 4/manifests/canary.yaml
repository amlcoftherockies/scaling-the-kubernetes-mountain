# Stable Release (3 replicas = 75% of Pod endpoints)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=STABLE release (v1.0)"]
        ports:
        - containerPort: 8080
---
# Canary Release (1 replica = 25% of Pod endpoints)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: canary-demo
        track: canary
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=CANARY release (v2.0)"]
        ports:
        - containerPort: 8080
---
# Shared Service — selects ONLY `app: canary-demo`, load-balancing across BOTH tracks!
apiVersion: v1
kind: Service
metadata:
  name: canary-service
spec:
  selector:
    app: canary-demo
  ports:
  - port: 80
    targetPort: 8080
