apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  labels:
    app: rs-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rs-web
  template:
    metadata:
      labels:
        app: rs-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
