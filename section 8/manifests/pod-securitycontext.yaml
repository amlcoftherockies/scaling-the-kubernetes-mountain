# Hardened Pod that satisfies the strictest Pod Security Standard ("restricted")
# Notice that applying this Pod produces ZERO PodSecurity warnings!
apiVersion: v1
kind: Pod
metadata:
  name: pod-hardened
  labels:
    app: hardened-demo
spec:
  # Pod-level SecurityContext (applies to all containers & volume ownership)
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "echo 'Hardened container running!' > /data/status.txt && sleep 3600"]
    # Container-level SecurityContext
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: writable-data
      mountPath: /data
  volumes:
  - name: writable-data
    emptyDir: {}
