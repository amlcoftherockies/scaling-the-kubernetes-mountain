# Intentionally violates Pod Security Standard "baseline" (privileged: true)
# Applying this in your workshop namespace will be rejected by Pod Security Admission!
apiVersion: v1
kind: Pod
metadata:
  name: pod-privileged-denied
spec:
  containers:
  - name: app
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    securityContext:
      privileged: true
