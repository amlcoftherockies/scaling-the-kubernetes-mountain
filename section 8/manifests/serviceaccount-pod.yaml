apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-runner-sa
# Opt out of auto-mounting the API token unless the Pod explicitly needs to call the K8s API
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-custom-sa
  labels:
    app: sa-demo
spec:
  serviceAccountName: app-runner-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
